name: Actualizar pronóstico

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, a los 7 minutos
  workflow_dispatch:       # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover -s tests

      - name: Traer lo guardado en la corrida anterior
        run: |
          if git fetch --depth=1 origin datos:refs/remotes/origin/datos 2>/dev/null; then
            git checkout origin/datos -- data/cache 2>/dev/null || true
            git show origin/datos:datos.json > web/datos.json 2>/dev/null || rm -f web/datos.json
            git reset -q
          fi

      - name: Juntar datos (Open-Meteo, mareas y pique)
        run: python scripts/actualizar.py

      - name: Guardar caché y datos en la rama "datos"
        if: hashFiles('web/datos.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp=$(mktemp -d)
          cp -r data "$tmp/"
          cp web/datos.json "$tmp/"
          cd "$tmp"
          git init -q -b datos
          git add -A
          git -c user.name="fishbotWeb" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Datos $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos

      - uses: actions/configure-pages@v5
        if: hashFiles('web/datos.json') != ''

      - uses: actions/upload-pages-artifact@v3
        if: hashFiles('web/datos.json') != ''
        with:
          path: web

      - id: deploy
        if: hashFiles('web/datos.json') != ''
        uses: actions/deploy-pages@v4
